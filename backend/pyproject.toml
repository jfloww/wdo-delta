[project]
name = "offerdelta"
version = "0.1.0"
description = "Personalized job offer and relocation decision engine"
requires-python = ">=3.12"

# The domain layer stays standard-library only (blueprint section 10.1); the
# import-linter contract below enforces that these never reach it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerdelta"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime
    "PIE",
    "PT",        # pytest style
    "RET",
    "SIM",
    "ARG",       # unused arguments
    "PL",        # pylint
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments: financial models legitimately have many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are the point of a test

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# Pydantic's BaseModel carries explicit Any in its own signatures, and a wire
# boundary deals in untyped JSON by nature. The relaxation stops at the API
# edge: the domain, where exactness is the point, stays maximally strict.
[[tool.mypy.overrides]]
module = ["offerdelta.api.*"]
disallow_any_explicit = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "property: Hypothesis property-based tests",
]

# ---------------------------------------------------------------- import-linter

[tool.importlinter]
root_package = "offerdelta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on the standard library only"
type = "forbidden"
source_modules = ["offerdelta.domain"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "boto3",
    "botocore",
    "pyspark",
    "httpx",
    "requests",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "offerdelta.api",
    "offerdelta.application",
    "offerdelta.domain",
]
exhaustive = false
